<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>너진똑 MBTI 성격 테스트</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff7fa;
  color:#333;
  font-family:'Noto Sans KR',sans-serif;
}

.container{
  width:min(720px,92%);
  margin:40px auto;
}

.card{
  background:white;
  border-radius:30px;
  padding:35px 30px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1,h2,h3{
  font-family:'Jua',sans-serif;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.hidden{
  display:none!important;
}

/* 시작 화면 */

.start{
  text-align:center;
}

.start h1{
  font-size:42px;
  margin:10px 0;
}

.start p{
  line-height:1.8;
  color:#777;
}

.start-character{
  width:180px;
  height:180px;
  object-fit:contain;
  margin:10px auto 20px;
}

/* 버튼 */

.main-button{
  width:100%;
  padding:17px;
  border-radius:18px;
  background:#ff9fba;
  color:white;
  font-size:20px;
  font-weight:700;
  margin-top:20px;
}

.main-button:hover{
  transform:translateY(-2px);
}

/* 퀴즈 */

.progress-info{
  display:flex;
  justify-content:space-between;
  color:#888;
  margin-bottom:10px;
}

.progress{
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:30px;
}

.progress-bar{
  height:100%;
  width:0;
  background:#ff9fba;
  transition:.3s;
}

.question{
  font-family:'Jua',sans-serif;
  font-size:27px;
  line-height:1.5;
  margin-bottom:25px;
}

.answer{
  width:100%;
  text-align:left;
  padding:18px;
  background:#fff5f8;
  border:2px solid transparent;
  border-radius:18px;
  margin:7px 0;
  font-size:16px;
  line-height:1.5;
}

.answer:hover{
  border-color:#ff9fba;
  background:#fff0f5;
}

/* 결과 */

.result{
  text-align:center;
}

.result-type{
  font-family:'Jua',sans-serif;
  font-size:58px;
  color:#ff7599;
  margin:0;
}

.result-name{
  font-family:'Jua',sans-serif;
  font-size:27px;
  margin:5px 0 20px;
}

.panda-image-box{
  width:100%;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff8fa;
  border-radius:25px;
  margin:20px 0;
  overflow:hidden;
}

#panda-image{
  display:block;
  width:100%;
  max-width:360px;
  max-height:360px;
  object-fit:contain;
  margin:auto;
}

.description{
  text-align:left;
  line-height:1.9;
  background:#fff8fa;
  border-radius:20px;
  padding:22px;
  margin:20px 0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.tag{
  background:#ffe0e9;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
}

/* 점수 */

.score-section{
  text-align:left;
  margin-top:30px;
}

.score-title{
  font-family:'Jua',sans-serif;
  font-size:23px;
  margin-bottom:20px;
}

.score-row{
  margin:18px 0;
}

.score-label{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  margin-bottom:7px;
}

.score-track{
  height:15px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.score-fill{
  height:100%;
  background:#ff9fba;
  border-radius:20px;
  transition:1s;
}

.score-numbers{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#777;
  margin-top:5px;
}

.result-buttons{
  display:flex;
  gap:10px;
  margin-top:30px;
}

.result-buttons button{
  flex:1;
  padding:15px;
  border-radius:15px;
  background:#ff9fba;
  color:white;
  font-size:16px;
  font-weight:700;
}

.result-buttons button:last-child{
  background:#ddd;
  color:#555;
}
</style>
</head>

<body>

<div class="container">

<!-- 시작 화면 -->
<div id="start-screen" class="card start">

  <div style="font-size:80px;">🐼</div>

  <h1>너진똑 MBTI</h1>

  <p>
    32개의 질문으로 알아보는<br>
    나의 성격 유형 테스트!
  </p>

  <p>
    각 질문에서 나에게 가장 가까운 답을 골라주세요.
  </p>

  <button class="main-button" onclick="startTest()">
    테스트 시작하기
  </button>

</div>


<!-- 퀴즈 화면 -->
<div id="quiz-screen" class="card hidden">

  <div class="progress-info">
    <span id="question-number">1 / 32</span>
    <span id="progress-percent">3%</span>
  </div>

  <div class="progress">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <div id="question" class="question"></div>

  <div id="answers"></div>

</div>


<!-- 결과 화면 -->
<div id="result-screen" class="card result hidden">

  <p style="margin-bottom:5px;">나의 MBTI는</p>

  <h1 id="result-type" class="result-type"></h1>

  <div id="result-name" class="result-name"></div>

  <!-- ★ MBTI 이미지 -->
  <div class="panda-image-box">
    <img id="panda-image" src="" alt="너진똑 MBTI 캐릭터">
  </div>

  <!-- 특징 -->
  <div id="description" class="description"></div>

  <!-- 태그 -->
  <div id="tags" class="tags"></div>

  <!-- 점수 -->
  <div class="score-section">

    <div class="score-title">
      🧠 나의 MBTI 점수 지수
    </div>

    <!-- E / I -->
    <div class="score-row">

      <div class="score-label">
        <span>E 외향</span>
        <span>I 내향</span>
      </div>

      <div class="score-track">
        <div id="ei-bar" class="score-fill"></div>
      </div>

      <div class="score-numbers">
        <span id="e-score">0점 (0%)</span>
        <span id="i-score">0점 (0%)</span>
      </div>

    </div>


    <!-- S / N -->
    <div class="score-row">

      <div class="score-label">
        <span>S 감각</span>
        <span>N 직관</span>
      </div>

      <div class="score-track">
        <div id="sn-bar" class="score-fill"></div>
      </div>

      <div class="score-numbers">
        <span id="s-score">0점 (0%)</span>
        <span id="n-score">0점 (0%)</span>
      </div>

    </div>


    <!-- T / F -->
    <div class="score-row">

      <div class="score-label">
        <span>T 사고</span>
        <span>F 감정</span>
      </div>

      <div class="score-track">
        <div id="tf-bar" class="score-fill"></div>
      </div>

      <div class="score-numbers">
        <span id="t-score">0점 (0%)</span>
        <span id="f-score">0점 (0%)</span>
      </div>

    </div>


    <!-- J / P -->
    <div class="score-row">

      <div class="score-label">
        <span>J 판단</span>
        <span>P 인식</span>
      </div>

      <div class="score-track">
        <div id="jp-bar" class="score-fill"></div>
      </div>

      <div class="score-numbers">
        <span id="j-score">0점 (0%)</span>
        <span id="p-score">0점 (0%)</span>
      </div>

    </div>

  </div>


  <div class="result-buttons">

    <button onclick="restartTest()">
      다시 해보기
    </button>

    <button onclick="goHome()">
      처음으로
    </button>

  </div>

</div>

</div>

========================================================= */

const imageFiles = {

========================================================= */

function showQuestion(){

  const question = questions[currentQuestion];

  document.getElementById("question-number").textContent =
    (currentQuestion + 1) + " / " + questions.length;

  const percent =
    Math.round(((currentQuestion + 1) / questions.length) * 100);

  document.getElementById("progress-percent").textContent =
    percent + "%";

  document.getElementById("progress-bar").style.width =
    percent + "%";

  document.getElementById("question").textContent =
    question.q;

  const answers =
    document.getElementById("answers");

  answers.innerHTML = "";

  question.a.forEach(function(answer){

    const button = document.createElement("button");

    button.className = "answer";

    button.textContent = answer[0];

    button.onclick = function(){

      scores[answer[1]]++;

      currentQuestion++;

      if(currentQuestion >= questions.length){

        showResult();

      }else{

        showQuestion();

      }

    };

    answers.appendChild(button);

  });

}


/* =========================================================
   MBTI 계산
========================================================= */

function calculateMBTI(){

  let mbti = "";

  mbti += scores.E >= scores.I ? "E" : "I";
  mbti += scores.S >= scores.N ? "S" : "N";
  mbti += scores.T >= scores.F ? "T" : "F";
  mbti += scores.J >= scores.P ? "J" : "P";

  return mbti;
}


/* =========================================================
   점수 표시
========================================================= */

function setScoreBar(
  barId,
  left,
  right,
  leftId,
  rightId
){

  const total = left + right;

  const leftPercent =
    total === 0
      ? 50
      : Math.round((left / total) * 100);

  const rightPercent =
    100 - leftPercent;

  document.getElementById(barId).style.width =
    leftPercent + "%";

  document.getElementById(leftId).textContent =
    left + "점 (" + leftPercent + "%)";

  document.getElementById(rightId).textContent =
    right + "점 (" + rightPercent + "%)";
}


/* =========================================================
   결과 표시
========================================================= */

function showResult(){

  const mbti = calculateMBTI();

  const result = results[mbti];

  document.getElementById("quiz-screen")
    .classList.add("hidden");

  document.getElementById("result-screen")
    .classList.remove("hidden");


  /* MBTI */

  document.getElementById("result-type")
    .textContent = mbti;

  document.getElementById("result-name")
    .textContent = result.name;


  /* =====================================================
     ★★★ 이미지 넣는 핵심 코드 ★★★

     예를 들어 mbti가 ENFP라면

     imageFiles["ENFP"]

     → "ENFP.jpg"

     가 됩니다.
  ===================================================== */

  const pandaImage =
    document.getElementById("panda-image");

  const imageFile =
    imageFiles[mbti];

  /*
     index.html과 이미지가 같은 폴더이므로
     현재 페이지 기준으로 정확한 주소를 만듭니다.
  */

  pandaImage.src =
    new URL(imageFile, document.baseURI).href
    + "?v=" + Date.now();

  pandaImage.alt =
    mbti + " 너진똑";


  /* 특징 */

  document.getElementById("description")
    .textContent = result.desc;


  /* 태그 */

  const tags =
    document.getElementById("tags");

  tags.innerHTML = "";

  result.tags.forEach(function(tag){

    const span =
      document.createElement("span");

    span.className = "tag";

    span.textContent = "#" + tag;

    tags.appendChild(span);

  });


  /* 점수 */

  setScoreBar(
    "ei-bar",
    scores.E,
    scores.I,
    "e-score",
    "i-score"
  );

  setScoreBar(
    "sn-bar",
    scores.S,
    scores.N,
    "s-score",
    "n-score"
  );

  setScoreBar(
    "tf-bar",
    scores.T,
    scores.F,
    "t-score",
    "f-score"
  );

  setScoreBar(
    "jp-bar",
    scores.J,
    scores.P,
    "j-score",
    "p-score"
  );


  /*
     이미지가 존재하지 않을 때
     화면에 오류 문구를 보여줍니다.
  */

  pandaImage.onerror = function(){

    pandaImage.alt =
      mbti + ".jpg 파일을 찾을 수 없습니다.";

    pandaImage.style.display = "none";

    const box =
      document.querySelector(".panda-image-box");

    box.innerHTML =
      "<div style='padding:30px;color:#999;'>" +
      mbti +
      ".jpg 이미지를 찾을 수 없습니다.<br>" +
      "GitHub에서 index.html과 같은 폴더에 있는지 확인해주세요." +
      "</div>";

  };

}


/* =========================================================
   다시 하기
========================================================= */

function restartTest(){

  document.getElementById("result-screen")
    .classList.add("hidden");

  startTest();

}


/* =========================================================
   처음으로
========================================================= */

function goHome(){

  document.getElementById("quiz-screen")
    .classList.add("hidden");

  document.getElementById("result-screen")
    .classList.add("hidden");

  document.getElementById("start-screen")
    .classList.remove("hidden");

}

</script>
