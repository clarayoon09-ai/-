/* =========================================================
   테스트 상태
========================================================= */

let currentQuestion = 0;

let scores = {
    E: 0,
    I: 0,

    S: 0,
    N: 0,

    T: 0,
    F: 0,

    J: 0,
    P: 0
};


/* =========================================================
   화면 전환
========================================================= */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {

        screen.classList.remove("active");

    });

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   테스트 시작
========================================================= */

function startTest() {

    currentQuestion = 0;

    scores = {
        E: 0,
        I: 0,
        S: 0,
        N: 0,
        T: 0,
        F: 0,
        J: 0,
        P: 0
    };

    showScreen("quiz-screen");

    showQuestion();
}


/* =========================================================
   질문 보여주기
========================================================= */

function showQuestion() {

    const q = questions[currentQuestion];


    document.getElementById("question-number").textContent =
        "Q" + (currentQuestion + 1);


    document.getElementById("current-number").textContent =
        currentQuestion + 1;


    document.getElementById("question-text").textContent =
        q.text;


    const progress =
        (currentQuestion / questions.length) * 100;


    document.getElementById("progress-fill").style.width =
        progress + "%";


    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";


    /* A 버튼 */

    const buttonA =
        document.createElement("button");

    buttonA.className = "answer";

    buttonA.innerHTML =
        '<span class="answer-letter">A</span>' +
        q.a;

    buttonA.onclick = function() {

        chooseAnswer("A");

    };


    /* B 버튼 */

    const buttonB =
        document.createElement("button");

    buttonB.className = "answer";

    buttonB.innerHTML =
        '<span class="answer-letter">B</span>' +
        q.b;

    buttonB.onclick = function() {

        chooseAnswer("B");

    };


    answers.appendChild(buttonA);

    answers.appendChild(buttonB);
}


/* =========================================================
   답변 선택
========================================================= */

function chooseAnswer(answer) {

    const q = questions[currentQuestion];


    if (q.type === "EI") {

        if (answer === "A") {
            scores.E++;
        } else {
            scores.I++;
        }

    }


    if (q.type === "SN") {

        if (answer === "A") {
            scores.S++;
        } else {
            scores.N++;
        }

    }


    if (q.type === "TF") {

        if (answer === "A") {
            scores.T++;
        } else {
            scores.F++;
        }

    }


    if (q.type === "JP") {

        if (answer === "A") {
            scores.J++;
        } else {
            scores.P++;
        }

    }


    currentQuestion++;


    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }
}


/* =========================================================
   MBTI 계산
========================================================= */

function calculateMBTI() {

    let mbti = "";


    mbti +=
        scores.E >= scores.I
        ? "E"
        : "I";


    mbti +=
        scores.S >= scores.N
        ? "S"
        : "N";


    mbti +=
        scores.T >= scores.F
        ? "T"
        : "F";


    mbti +=
        scores.J >= scores.P
        ? "J"
        : "P";


    return mbti;
}


/* =========================================================
   이미지 없을 때
========================================================= */

function showImageFallback() {

    document.getElementById("result-image")
        .style.display = "none";


    document.getElementById("image-placeholder")
        .style.display = "block";
}


/* =========================================================
   결과 보여주기
========================================================= */

function showResult() {

    const mbti = calculateMBTI();

    const result = results[mbti];


    /* MBTI */

    document.getElementById("result-mbti")
        .textContent = mbti;


    /* 유형 이름 */

    document.getElementById("result-name")
        .textContent = result.name;


    /* 설명 */

    document.getElementById("result-description")
        .textContent = result.description;


    /* 이미지 */

    const image =
        document.getElementById("result-image");


    const placeholder =
        document.getElementById("image-placeholder");


    image.style.display = "block";

    placeholder.style.display = "none";


    /*
       예:

       결과 = ENFP

       images/ENFP.png

       자동으로 불러옴
    */

    image.src =
        "images/" + mbti + ".png";


    image.alt =
        mbti + " 너진똑";


    /* 태그 */

    const tagContainer =
        document.getElementById("result-tags");


    tagContainer.innerHTML = "";


    result.tags.forEach(function(tag) {

        const span =
            document.createElement("span");

        span.className = "tag";

        span.textContent =
            "#" + tag;

        tagContainer.appendChild(span);

    });


    /* 결과 화면 */

    showScreen("result-screen");
}


/* =========================================================
   다시 테스트
========================================================= */

function restartTest() {

    startTest();

}
